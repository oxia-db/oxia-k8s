# Prepares a node: the kernel settings, containerd, and kubelet, kubeadm and kubectl
- name: Turn off swap
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] > 0
  changed_when: true

- name: Keep swap off after a reboot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load the kernel modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Load the kernel modules now
  ansible.builtin.command: modprobe {{ item }}
  loop: [overlay, br_netfilter]
  changed_when: false

- name: Set the network sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/kubernetes.conf
    content: |
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
    mode: "0644"
  notify: Apply the sysctls

- name: Install containerd
  ansible.builtin.apt:
    name: [containerd, gpg]
    update_cache: true
    cache_valid_time: 3600

- name: Create the containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Write the default containerd configuration
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

# The kubelet uses the systemd cgroup driver
- name: Use the systemd cgroup driver
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

- name: Start containerd
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started

- name: Add the key of the Kubernetes packages
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version | regex_replace('^(v\d+\.\d+).*$', '\1') }}/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: "0644"

- name: Add the Kubernetes packages
  ansible.builtin.deb822_repository:
    name: kubernetes
    uris: https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version | regex_replace('^(v\d+\.\d+).*$', '\1') }}/deb/
    suites: /
    signed_by: /etc/apt/keyrings/kubernetes.asc

- name: Install kubelet, kubeadm and kubectl
  ansible.builtin.apt:
    name:
      - kubelet={{ kubernetes_version[1:] }}-*
      - kubeadm={{ kubernetes_version[1:] }}-*
      - kubectl={{ kubernetes_version[1:] }}-*
    update_cache: true
    allow_change_held_packages: true

- name: Hold the Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

# The kubelet registers the node with the address the other machines reach
- name: Set the node address of the kubelet
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    content: |
      KUBELET_EXTRA_ARGS=--node-ip={{ node_address }}
    mode: "0644"
  notify: Restart the kubelet

- name: Enable the kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
